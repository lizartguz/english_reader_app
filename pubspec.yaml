name: english_reader_app
description: "Lectura en inglés con vocabulario personalizado."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: 10.3.1
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/

  # Roboto se empaqueta en vez de dejar que CanvasKit la descargue de
  # fonts.gstatic.com en cada carga. Sin ella, Flutter Web no tiene con que
  # dibujar texto y la app se ve sin una sola letra si ese CDN no responde.
  # Los archivos vienen del propio SDK de Flutter (licencia Apache 2.0, ver
  # assets/fonts/LICENSE-Roboto.txt).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/images/logo/logo.png"
    background_color: "#F7F8F4"
    theme_color: "#215C6B"
